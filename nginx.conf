server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nunca cachear o index.html: ele referencia assets com hash que mudam a cada build.
    # Se o navegador cachear um index.html velho, vai pedir assets que não existem mais (404).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # Cache de assets com hash (imutável — o nome do arquivo muda quando o conteúdo muda)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
